services:
  sala:
    build: .
    env_file: .env
    environment:
      TZ: Europe/Copenhagen
    ports:
      # Bound to all interfaces. Restrict to one address (e.g. "192.168.1.10:8000:8000"
      # or your Tailscale IP) unless the host is only reachable on a trusted network.
      - "${SALA_PORT:-8000}:8000"
    volumes:
      - sala-data:/data
    restart: unless-stopped

volumes:
  sala-data:
