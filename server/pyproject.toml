[project]
name = "sala-server"
version = "0.1.0"
description = "Home server that holds an Aula session and serves a small JSON API to the Sala iOS app."
requires-python = ">=3.14"
dependencies = [
    "aula==1.19.0",
    "fastapi",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]
