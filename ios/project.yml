name: Sala
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
fileGroups:
  - Config/Signing.xcconfig
  - Config/Local.example.xcconfig
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Sala:
    type: application
    platform: iOS
    sources:
      - path: Sala
      - path: Shared
    dependencies:
      - target: SalaWidget
    scheme:
      testTargets: [SalaTests]
    entitlements:
      path: Sala/Sala.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)$(SALA_BUNDLE_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SALA_BUNDLE_ID).app
        PRODUCT_NAME: Sala
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Sala/Info.plist
      properties:
        CFBundleDisplayName: Sala
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SalaKeychainGroup: $(AppIdentifierPrefix)$(SALA_BUNDLE_ID)
        UILaunchScreen:
          UIImageName: LaunchLogo
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [sala]
        NSPhotoLibraryAddUsageDescription: Sala saves photos from the gallery to your library.
        NSCalendarsFullAccessUsageDescription: Sala keeps a Sala calendar up to date with Aula's events, and removes the ones Aula drops.
  SalaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SalaWidget
      - path: Shared
    entitlements:
      path: SalaWidget/SalaWidget.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)$(SALA_BUNDLE_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SALA_BUNDLE_ID).app.widget
        PRODUCT_NAME: SalaWidget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: SalaWidget/Info.plist
      properties:
        CFBundleDisplayName: Sala
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SalaKeychainGroup: $(AppIdentifierPrefix)$(SALA_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  SalaTests:
    # Not hosted: the Aula port and the API models are compiled in, so the tests never launch the
    # app (whose session would reach real Aula). Goldens are read from the source tree.
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SalaTests
        excludes: [Goldens]
      - path: Sala/Aula
      - path: Sala/API.swift
      - path: Shared/SalaShared.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SALA_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
