name: Sala
options:
  bundleIdPrefix: app.sala
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Sala:
    type: application
    platform: iOS
    sources:
      - path: Sala
      - path: Shared
    dependencies:
      - target: SalaWidget
    entitlements:
      path: Sala/Sala.entitlements
      properties:
        com.apple.security.application-groups: [group.app.sala.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sala.ios
        PRODUCT_NAME: Sala
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Sala/Info.plist
      properties:
        CFBundleDisplayName: Sala
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: app.sala.ios
            CFBundleURLSchemes: [sala]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Sala talks to your home server on the local network.
  SalaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SalaWidget
      - path: Shared
    entitlements:
      path: SalaWidget/SalaWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.app.sala.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sala.ios.widget
        PRODUCT_NAME: SalaWidget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: SalaWidget/Info.plist
      properties:
        CFBundleDisplayName: Sala
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
