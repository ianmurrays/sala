name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The CLI, not gitleaks-action: the action needs PR API access the default token lacks.
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git --no-banner -v /repo

  ios:
    runs-on: xcode-27  # public preview image; the only GitHub runner with the iOS 27 SDK
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Sala.xcodeproj matches project.yml
        run: |
          xcodegen generate
          git diff --exit-code -- Sala.xcodeproj || { echo "::error::Sala.xcodeproj is out of date: run xcodegen generate in ios/ and commit it"; exit 1; }
      - name: Build and test on a simulator
        run: |
          sim=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone[^(]+' | sed 's/ *$//')
          xcodebuild -project Sala.xcodeproj -scheme Sala -destination "platform=iOS Simulator,name=$sim" -quiet test
